services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omnierp}
      POSTGRES_USER: ${POSTGRES_USER:-omnierp_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - omnierp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omnierp_app} -d ${POSTGRES_DB:-omnierp}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  omnierp_pgdata:
